name = "fontexto"
pages_build_output_dir = "dist/site"
compatibility_date = "2026-11-13"

# Anonymous daily visit totals only (not a secret). Preview uses its own namespace.
[[kv_namespaces]]
binding = "VISITS"
id = "e972ee2ed9714d53b41b87f8cb224b05"
preview_id = "2ce52636998d4f63bc771a533d639fbf"

# Optional global cache for /api/oa lookups (shared by every data centre; the Cache API is per data centre).
# With many users, popular references are then looked up upstream once instead of once per region.
# Namespaces fontexto-oa-cache / fontexto-oa-cache-preview. scripts/ensure-kv.mjs recreates the binding if it is ever removed.
[[kv_namespaces]]
binding = "OA_CACHE"
id = "3ef84eefa7ae4f45925ffdd15bbb02d2"
preview_id = "b5b818961385480c82d0bebbd5dae22d"

# Opt-in calibration feedback: running totals of (automatic label, reader's label, score bucket, semantic on/off).
# No text or identifiers (src/core/feedback.ts). Namespaces fontexto-feedback / fontexto-feedback-preview.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "6a2afc88ac044d62ab3c943dbc89da0c"
preview_id = "074e1aceb256436ca32d11e60c819cf3"

# Preview-only bindings (Pablo: create the same in production before enabling global rate limits).
# Pages Functions do not yet expose the ratelimits binding on all accounts; prefer WAF (below) + in-isolate limiter.
# [[unsafe.bindings]]
# name = "OA_RL"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 250, period = 60 }
#
# [[kv_namespaces]]
# binding = "OA_RATE"
# id = "<preview-kv-id>"
# preview_id = "<preview-kv-id>"
