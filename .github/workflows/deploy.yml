name: Deploy site
# Publishes fontexto.com (Cloudflare Pages, direct upload) on every push to main, after the tests pass.
# Needs the repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers", which includes Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: afe264ff44197ad978ed8e3ae58128a5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # semantic search model (~130 MB) and OCR data: without them the site would ship without those features
      - run: npm run fetch-model
      - run: npm run fetch-tessdata
      - run: npm run build:site
      - name: Model is in the build
        run: test -f dist/site/models/minilm/manifest.json
      - name: Publish to Cloudflare Pages
        run: >-
          npx --yes wrangler@4.163.0 pages deploy dist/site
          --project-name=fontexto --branch=main
          --commit-hash="$GITHUB_SHA" --commit-dirty=true
